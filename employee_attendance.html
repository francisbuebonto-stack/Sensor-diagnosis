<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .date-display {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        input[type="date"],
        select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.delete-btn {
            background: #ff6b6b;
            padding: 5px 10px;
            font-size: 12px;
        }

        button.delete-btn:hover {
            background: #ff5252;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-box h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .status.present {
            background: #d4edda;
            color: #155724;
        }

        .status.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .status.leave {
            background: #cfe2ff;
            color: #084298;
        }

        .attendance-buttons {
            display: flex;
            gap: 5px;
        }

        .attendance-buttons button {
            flex: 1;
            padding: 5px 8px;
            font-size: 12px;
        }

        .present-btn {
            background: #28a745;
        }

        .present-btn:hover {
            background: #218838;
        }

        .absent-btn {
            background: #dc3545;
        }

        .absent-btn:hover {
            background: #c82333;
        }

        .leave-btn {
            background: #0066cc;
        }

        .leave-btn:hover {
            background: #0052a3;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .input-group {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Employee Attendance Tracker</h1>
        <div class="date-display" id="dateDisplay"></div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="employeeName" placeholder="Enter employee name">
                <button onclick="addEmployee()">Add Employee</button>
            </div>
            <div class="input-group">
                <input type="date" id="attendanceDate">
                <select id="filterStatus">
                    <option value="">All Status</option>
                    <option value="present">Present</option>
                    <option value="absent">Absent</option>
                    <option value="leave">Leave</option>
                </select>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h3>Total Employees</h3>
                <div class="value" id="totalEmployees">0</div>
            </div>
            <div class="stat-box">
                <h3>Present Today</h3>
                <div class="value" id="presentCount">0</div>
            </div>
            <div class="stat-box">
                <h3>Absent Today</h3>
                <div class="value" id="absentCount">0</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        let attendance = JSON.parse(localStorage.getItem('attendance')) || [];

        function updateDateDisplay() {
            const today = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('dateDisplay').textContent = `Today: ${today}`;
            document.getElementById('attendanceDate').valueAsDate = new Date();
        }

        function addEmployee() {
            const nameInput = document.getElementById('employeeName');
            const name = nameInput.value.trim();

            if (!name) {
                alert('Please enter an employee name');
                return;
            }

            if (employees.some(emp => emp.name.toLowerCase() === name.toLowerCase())) {
                alert('Employee already exists');
                return;
            }

            const employee = {
                id: Date.now(),
                name: name
            };

            employees.push(employee);
            localStorage.setItem('employees', JSON.stringify(employees));
            nameInput.value = '';
            renderTable();
            updateStats();
        }

        function markAttendance(employeeId, status) {
            const date = document.getElementById('attendanceDate').value;
            const key = `${employeeId}-${date}`;

            const index = attendance.findIndex(att => att.id === key);
            if (index > -1) {
                attendance[index].status = status;
            } else {
                attendance.push({
                    id: key,
                    employeeId: employeeId,
                    date: date,
                    status: status
                });
            }

            localStorage.setItem('attendance', JSON.stringify(attendance));
            renderTable();
            updateStats();
        }

        function deleteEmployee(employeeId) {
            if (confirm('Are you sure you want to delete this employee?')) {
                employees = employees.filter(emp => emp.id !== employeeId);
                attendance = attendance.filter(att => att.employeeId !== employeeId);
                localStorage.setItem('employees', JSON.stringify(employees));
                localStorage.setItem('attendance', JSON.stringify(attendance));
                renderTable();
                updateStats();
            }
        }

        function getAttendanceStatus(employeeId, date) {
            const record = attendance.find(att => att.employeeId === employeeId && att.date === date);
            return record ? record.status : null;
        }

        function renderTable() {
            const date = document.getElementById('attendanceDate').value;
            const filterStatus = document.getElementById('filterStatus').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-message">No employees added yet. Add an employee to get started!</td></tr>';
                return;
            }

            employees.forEach(emp => {
                const status = getAttendanceStatus(emp.id, date);

                if (filterStatus && status !== filterStatus) {
                    return;
                }

                const row = document.createElement('tr');
                const statusDisplay = status ? `<span class="status ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>` : '<span class="status">Not Marked</span>';

                row.innerHTML = `
                    <td>${emp.name}</td>
                    <td>${new Date(date).toLocaleDateString()}</td>
                    <td>${statusDisplay}</td>
                    <td>
                        <div class="attendance-buttons">
                            <button class="present-btn" onclick="markAttendance(${emp.id}, 'present')">✓ Present</button>
                            <button class="absent-btn" onclick="markAttendance(${emp.id}, 'absent')">✗ Absent</button>
                            <button class="leave-btn" onclick="markAttendance(${emp.id}, 'leave')">⊘ Leave</button>
                        </div>
                    </td>
                    <td>
                        <button class="delete-btn" onclick="deleteEmployee(${emp.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats() {
            const date = document.getElementById('attendanceDate').value;
            const total = employees.length;
            const present = attendance.filter(att => att.date === date && att.status === 'present').length;
            const absent = attendance.filter(att => att.date === date && att.status === 'absent').length;

            document.getElementById('totalEmployees').textContent = total;
            document.getElementById('presentCount').textContent = present;
            document.getElementById('absentCount').textContent = absent;
        }

        document.getElementById('attendanceDate').addEventListener('change', () => {
            renderTable();
            updateStats();
        });

        document.getElementById('filterStatus').addEventListener('change', renderTable);

        document.getElementById('employeeName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addEmployee();
        });

        updateDateDisplay();
        renderTable();
        updateStats();
    </script>
</body>
</html>
